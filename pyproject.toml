[build-system]
requires = ["scikit-build-core>=0.11", "setuptools-scm>=8", "pybind11>=3"]
build-backend = "scikit_build_core.build"

[project]
name = "pyhepmc"
description = "Pythonic interface to the HepMC3 C++ library licensed under LGPL-v3."
maintainers = [{ name = "Hans Dembinski", email = "hans.dembinski@gmail.com" }]
readme = "README.rst"
requires-python = ">=3.10"
# pyhepmc is BSD-3-Clause; the compiled module includes HepMC3 (LGPL-3.0-or-later),
# its bxzstr headers (MPL-2.0), pybind11 (BSD-3-Clause), Boost.Mp11 (BSL-1.0) and
# cpp-member-accessor (MIT). See LICENSES_bundled.
license = "BSD-3-Clause AND LGPL-3.0-or-later AND MPL-2.0 AND BSL-1.0 AND MIT"
license-files = [
    "LICENSE",
    "LICENSES_bundled",
    "extern/HepMC3/LICENCE",
    "extern/HepMC3/COPYING",
    "extern/HepMC3/include/HepMC3/bxzstr/LICENSE",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Developers",
]
dependencies = [
    "numpy>=1.21",
    "packaging",
    "backports.zstd ; python_version<'3.14'",
]

dynamic = ["version"]

[project.urls]
repository = "https://github.com/scikit-hep/pyhepmc"
documentation = "https://scikit-hep.org/pyhepmc"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-timeout",
    "particle<1.0.0",
    # There are issues with binary wheels on some platforms right now
    'matplotlib; (platform_system != "Windows" or python_version <"3.12") and (platform_system != "Linux" or platform_machine != "aarch64")',
]
doc = ["sphinx", "sphinx-rtd-theme", "nbsphinx", "ipython", "ipykernel"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
# Ship only the parts of the bundled submodules that the build uses.
sdist.exclude = ["/.github", "/extern/**"]
sdist.include = [
    "/extern/HepMC3/include",
    "/extern/HepMC3/src",
    "/extern/HepMC3/LICENCE",
    "/extern/HepMC3/COPYING",
    "/extern/mp11/include",
    "/extern/cpp-member-accessor/include",
    "/extern/cpp-member-accessor/LICENSE",
]

[tool.setuptools_scm]

[tool.mypy]
strict = true
no_implicit_optional = false
allow_redefinition = true
ignore_missing_imports = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-config --strict-markers -q -ra --ff"
testpaths = ["tests"]
log_level = "INFO"
xfail_strict = true
filterwarnings = [
    "error::PendingDeprecationWarning",
    "error::DeprecationWarning",
    "error::FutureWarning",
]

[tool.coverage.run]
relative_files = true
source = ["pyhepmc"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]

[tool.ruff]
exclude = ["docs/examples/*"]

[tool.ruff.lint]
extend-select = [
    "E",
    "F", # flake8
    "D", # pydocstyle
]
unfixable = [
    "F841", # Removes unused variables
]
extend-ignore = [
    "D212", # multi-line-summary-first-line
    "E731", # lambda-assignment
]
pydocstyle.convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["B", "D"]
"bench/*.py" = ["D"]
"docs/*.py" = ["D"]
"generate_*.py" = ["D"]

[tool.cibuildwheel]
build = "cp3*-*"
# Windows ARM64 CPython wheels start at Python 3.11.
skip = ["cp310-win_arm64"]
test-extras = ["test"]
test-command = "python -m pytest -vv --timeout=120 --timeout-method=thread {package}/tests"

[tool.cibuildwheel.environment]
# this makes sure that we build only on platforms that have a corresponding numpy wheel
PIP_ONLY_BINARY = ":all:"
# flag is used to disable a test that doesn't work on CI
CIBW = "1"

[tool.cibuildwheel.macos]
archs = ["arm64"]
