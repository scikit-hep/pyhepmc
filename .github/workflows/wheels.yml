name: Wheels

on:
  push:
    tags:
      - "**"
  pull_request:
    paths:
      - .github/workflows/wheels.yml
      - pyproject.toml
      - MANIFEST.in
      - CMakeLists.txt
      - "setup*.py"
      - cmake_ext.py
      - "src/**"
      - "extern/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  PYTEST_ADDOPTS: "-vv --timeout=120 --timeout-method=thread"

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            windows-latest,
            macos-latest,
            ubuntu-26.04-arm,
            windows-11-vs2026-arm,
          ]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0 # needed by setuptools_scm

      - uses: astral-sh/setup-uv@v8.2.0

      # Supported stable CPython versions come from requires-python.
      - uses: pypa/cibuildwheel@v4.1

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  sdist:
    name: source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0 # needed by setuptools_scm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - run: pipx run build --sdist
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -v $(echo dist/*)'[test]'
      - run: python -m pytest

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  upload:
    if: github.event_name == 'push' && contains(github.event.ref, '/tags/')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/pyhepmc/

    permissions:
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1.14
