name: Test

on:
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - "**.py"
      - "**.cpp"
      - "**.hpp"
      - pyproject.toml
      - CMakeLists.txt
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  PYTEST_ADDOPTS: "-vv --timeout=120 --timeout-method=thread"

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # Keep one lower-bound job; other jobs track stable Python releases.
          - os: ubuntu-latest
            python-version: "3.10"
            installs: ""
          - os: windows-latest
            python-version: "3.x"
            installs: ""
          - os: macos-latest
            python-version: "3.x"
            installs: ""
          - os: ubuntu-latest
            python-version: "3.x"
            installs: "scipy"
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 3
      # must come after checkout
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.os }}-${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ts-graphviz/setup-graphviz@v2
        with:
          # Use the runner's Homebrew snapshot instead of updating its toolchain.
          macos-skip-brew-update: true
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - run: uv pip install --system ".[test]" ${{ matrix.installs }}
        env:
          DEBUG: 1
      # A native-code deadlock can prevent pytest-timeout's Python thread from running.
      - run: >-
          python -u -c "import faulthandler;
          faulthandler.dump_traceback_later(180, exit=True);
          import pytest; raise SystemExit(pytest.main())"
